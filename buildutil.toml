[project]
name = "opeu"
# The machinery's macros (OPEU_CONTRACTS, OPEU_BUILD_*, OPEU_<MODULE>_ENABLED)
# share the port's OPEU_ prefix without clashing with its own OPEU_HOST_EVENTS,
# OPEU_FAR, OPEU_TRACE or OPEU_LOG: no option may be named host_events, far,
# trace or log.
cmake_option_prefix = "OPEU"
module_define_prefix = "OPEU"
cxx_standard = 23

[options]
# sources/opeu/contract.hpp: stop (report, abort), halt (report, throw
# opeu::ContractFailure), complain (report, carry on) or ignore.
# `buildutil build --option contracts=halt` chooses another for one build.
contracts = "stop"

[cmake]
# opt-in machinery beyond the buildutil.cmake base (buildutil extend)
extensions = []

[run]
# `buildutil run` builds + launches this installed binary
default = "opeu"

[conan]
# Linux: conan's sdl recipe builds every audio backend it enables from
# source. PulseAudio 17 and sndio are dropped: ALSA reaches PipeWire and
# PulseAudio desktops through their ALSA plugins, and sndio is the BSDs'.
# X11, Wayland, OpenGL/EGL, udev and D-Bus stay; their */system recipes need
# the host's -dev packages.
options_linux = [
  "sdl/*:pulseaudio=False",
  "sdl/*:sndio=False",
]

# An application, not a package: kind = "none" makes conanfile.py a plain
# consumer, with no package_id, export or test_package.
[package]
kind = "none"

[venv]
# tools/rename/rename.py: clang's Python bindings; the wheel bundles a libclang, a system LLVM's is preferred.
# tools/remaster: Pillow reads, checks and lays out the images; PyYAML reads the prompt templates' front matter.
# tools/release: git-filter-repo, as a library, writes the public mirror's filtered history.
extra_deps = ["libclang==18.1.1", "Pillow==11.3.0", "PyYAML==6.0.3", "git-filter-repo==2.47.0"]
