# buildutil drives the native build of the Operation Europe port: conan
# resolves SDL3 (and GoogleTest for the C++ suites), cmake configures the
# root CMakeLists.txt, ninja builds and ctest runs every suite. The DOS
# reference build (src/, the gate, the validators) stays on the Makefile and
# is untouched by this file. Notes, commands and Linux status:
# docs/buildutil-notes.md.

[project]
name = "opeurptv"
# The machinery's own prefix (OPEURPTV_OPTION_*, OPEURPTV_BUILD_*,
# OPEURPTV_<MODULE>_ENABLED). Deliberately not the port's OPEU_*: the C
# port's cache variables and defines (OPEU_SRC, OPEU_TEST_PYTHON,
# OPEU_DEFAULT_DATA_DIR, OPEU_HAVE_*) keep their names and meanings.
cmake_option_prefix = "OPEURPTV"
module_define_prefix = "OPEURPTV"
# port under port/ keeps its own C99/C++14 settings and is not a module.
cxx_standard = 23

[options]
# sources/opeu/contract.hpp: stop (report, abort), halt (report, throw
# opeu::ContractFailure), complain (report, carry on) or ignore.
# `buildutil build --option contracts=halt` chooses another for one build.
contracts = "stop"

[cmake]
# opt-in machinery beyond the buildutil.cmake base (buildutil extend)
extensions = []

[run]
# The game executable once it lives in sources/ (the reorganisation moves
# the port there); until then `make port` builds and runs it.
default = "opeu"

[conan]
# Linux: conan's sdl recipe builds every audio backend it enables from
# source. PulseAudio 17 and sndio are dropped: ALSA reaches PipeWire and
# PulseAudio desktops through their ALSA plugins, and sndio is the BSDs'.
# X11, Wayland, OpenGL/EGL, udev and D-Bus stay; their */system recipes need
# the host's -dev packages (docs/buildutil-notes.md, "Linux").
options_linux = [
  "sdl/*:pulseaudio=False",
  "sdl/*:sndio=False",
]

# An application, not a package: kind = "none" makes conanfile.py a plain
# consumer, with no package_id, export or test_package.
[package]
kind = "none"
