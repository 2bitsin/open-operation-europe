<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Europe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc;
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The canvas sits in a scrollable stage: margin:auto centres it when it
     fits and lets the stage scroll (instead of clipping) when a manual zoom
     makes it larger than the window. */
  #stage { position: relative; display: flex; width: 100vw; height: 100vh; overflow: auto; }
  /* The game frame is 640x480; the script below sizes the canvas to an
     integer multiple in device pixels, so glyphs stay sharp: the largest that
     fits the window by default, or the multiple chosen with the zoom buttons.
     SDL3 sees that CSS size and integer-scales into it. */
  #canvas { display: block; flex: none; margin: auto; width: 640px; height: 480px;
            image-rendering: pixelated; image-rendering: crisp-edges;
            outline: none; cursor: none; background: #000; }
  #zoom { position: fixed; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 4px;
          padding: 4px; border-radius: 6px; background: rgba(20, 20, 20, 0.75); color: #ddd;
          font: 13px/1 ui-monospace, Menlo, Consolas, monospace; user-select: none; opacity: 0.55;
          transition: opacity 0.15s; }
  #zoom:hover, #zoom:focus-within { opacity: 1; }
  #zoom button { width: 28px; height: 28px; border: 1px solid #555; border-radius: 4px; background: #2a2a2a;
                 color: #eee; font: 16px/1 system-ui, sans-serif; cursor: pointer; padding: 0; }
  #zoom button:hover { background: #3a3a3a; }
  #zoom button:disabled { opacity: 0.35; cursor: default; }
  #zoom #zoomlabel { min-width: 72px; text-align: center; cursor: pointer; padding: 0 4px; }
  #zoom #zoomlabel:hover { color: #fff; text-decoration: underline; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             background: rgba(0, 0, 0, 0.82); cursor: pointer; user-select: none; }
  #overlay h1 { margin: 0; font-size: 28px; font-weight: 600; color: #eee; letter-spacing: 0.02em; }
  #overlay .hint { font-size: 15px; }
  #status { font-size: 13px; color: #999; min-height: 1.4em; }
  #overlay.done { cursor: default; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="640" height="480" tabindex="0"
          oncontextmenu="event.preventDefault()"></canvas>
  <div id="zoom" title="Integer zoom. Click the value to return to automatic fit. When the picture is larger than the window: scroll to pan, or drag with the middle button or Alt+drag. Keys: Cmd/Ctrl+Alt and + / - / 0.">
    <button id="zoomout" type="button" tabindex="-1" aria-label="Zoom out">&minus;</button>
    <span id="zoomlabel" tabindex="-1" role="button" aria-label="Fit to window"></span>
    <button id="zoomin" type="button" tabindex="-1" aria-label="Zoom in">+</button>
  </div>
  <script>
    (function () {
      var c = document.getElementById('canvas');
      var label = document.getElementById('zoomlabel');
      var out = document.getElementById('zoomout'), inn = document.getElementById('zoomin');
      var manual = 0;                 /* 0 = automatic (largest multiple that fits) */
      function dpr() { return window.devicePixelRatio || 1; }
      function fitting() {
        /* Work in device pixels: on a 2x display a 640x480 CSS box is already
           1280x960 device pixels, and the next exact step is 3x device
           (960x720 CSS), which CSS-pixel arithmetic could never choose. */
        return Math.max(1, Math.min(Math.floor(window.innerWidth * dpr() / 640),
                                    Math.floor(window.innerHeight * dpr() / 480)));
      }
      function fit() {
        var k = manual || fitting();
        c.style.width = (640 * k / dpr()) + 'px';
        c.style.height = (480 * k / dpr()) + 'px';
        label.textContent = k + '\u00d7' + (manual ? '' : ' auto');
        out.disabled = k <= 1;
      }
      /* SDL's Emscripten backend re-reads the canvas CSS size only on a window
         resize event, so after a manual zoom one is dispatched; otherwise the
         canvas backing store keeps its old size and the browser stretches it
         by a non-integer factor. */
      function apply() { fit(); window.dispatchEvent(new Event('resize')); c.focus(); }
      function set(k) { manual = Math.max(1, k); apply(); }
      out.addEventListener('click', function () { set((manual || fitting()) - 1); });
      inn.addEventListener('click', function () { set((manual || fitting()) + 1); });
      label.addEventListener('click', function () { manual = 0; apply(); });
      /* Cmd/Ctrl + Alt + '+' / '-' step the zoom, '0' returns to auto. Capturing
         on window so the game never sees these key presses. */
      window.addEventListener('keydown', function (e) {
        if (!((e.metaKey || e.ctrlKey) && e.altKey)) return;
        var k = manual || fitting();
        if (e.code === 'Equal' || e.code === 'NumpadAdd' || e.key === '+' || e.key === '=') set(k + 1);
        else if (e.code === 'Minus' || e.code === 'NumpadSubtract' || e.key === '-' || e.key === '_') set(k - 1);
        else if (e.code === 'Digit0' || e.code === 'Numpad0') { manual = 0; apply(); }
        else return;
        e.preventDefault(); e.stopPropagation();
      }, true);
      /* keep keyboard focus on the game */
      document.getElementById('zoom').addEventListener('mousedown', function (e) { e.preventDefault(); });
      window.addEventListener('resize', fit);
      fit();

      /* Panning when the canvas is larger than the window. The listeners are
         capturing on the stage, so they run before SDL's handlers on the
         canvas and can keep the event from reaching the game. The original
         game has no mouse wheel, so the wheel is free to scroll; dragging with
         the middle button or with Alt held pans without clicking in the game. */
      var stage = document.getElementById('stage');
      function overflowing() {
        return stage.scrollWidth > stage.clientWidth || stage.scrollHeight > stage.clientHeight;
      }
      stage.addEventListener('wheel', function (e) {
        if (!overflowing()) return;
        stage.scrollLeft += e.deltaX;
        stage.scrollTop += e.deltaY;
        e.preventDefault(); e.stopPropagation();
      }, { capture: true, passive: false });
      var pan = null;
      stage.addEventListener('pointerdown', function (e) {
        if (!(e.button === 1 || (e.button === 0 && e.altKey)) || !overflowing()) return;
        pan = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop };
        stage.style.cursor = 'grabbing';
        e.preventDefault(); e.stopPropagation();
      }, true);
      window.addEventListener('pointermove', function (e) {
        if (!pan) return;
        stage.scrollLeft = pan.left - (e.clientX - pan.x);
        stage.scrollTop = pan.top - (e.clientY - pan.y);
        e.preventDefault(); e.stopPropagation();
      }, true);
      function endPan(e) {
        if (!pan) return;
        pan = null; stage.style.cursor = '';
        e.preventDefault(); e.stopPropagation();
      }
      window.addEventListener('pointerup', endPan, true);
      window.addEventListener('pointercancel', endPan, true);
    })();
  </script>
  <div id="overlay">
    <h1>Operation Europe</h1>
    <div class="hint" id="hint">Click to start</div>
    <div id="status">Loading&hellip;</div>
  </div>
</div>
<script>
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var canvas = document.getElementById('canvas');
  var started = false;

  function start() {
    if (started) return;
    started = true;
    overlay.hidden = true;
    overlay.style.display = 'none';
    canvas.focus();
    if (Module.opeuStart) Module.opeuStart();
  }
  overlay.addEventListener('click', start);
  canvas.addEventListener('mousedown', function () { canvas.focus(); });

  /* ?autostart skips the click (automated browser checks); there is then
     no user gesture, so keyboard focus and audio may need a click later. */
  var autostart = new URLSearchParams(location.search).has('autostart');

  var Module = {
    canvas: canvas,
    opeuAutoStart: autostart,
    arguments: [],
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    setStatus: function (text) { statusEl.textContent = text || ''; },
    monitorRunDependencies: function (left) {
      /* one dependency stays open until the click: show "ready" then */
      if (left <= 1 && !started) statusEl.textContent = 'Ready';
    },
    onExit: function (code) {
      overlay.style.display = 'flex';
      overlay.classList.add('done');
      hintEl.textContent = 'The program has ended (exit code ' + code + '). Reload the page to play again.';
      statusEl.textContent = '';
    },
    onAbort: function (what) {
      overlay.style.display = 'flex';
      overlay.classList.add('done');
      hintEl.textContent = 'The program stopped with an error; see the browser console.';
      statusEl.textContent = String(what || '');
    }
  };
  if (autostart) start();
  window.addEventListener('error', function (e) {
    statusEl.textContent = 'Error: ' + e.message;
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
